<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Słownik Ubrania i Zakupy PL → DE</title>

<style>
:root {
    color-scheme: dark;
    --page: #0c1116;
    --panel: #141c23;
    --line: #2b3842;
    --text: #edf3f6;
    --muted: #a0afb9;
    --accent: #86e1c0;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 76px 24px 40px;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 50% 0%, #1b3034 0%, transparent 55%), var(--page);
    display: flex;
    align-items: flex-start;
    justify-content: center;
}
.container {
    width: 100%;
    max-width: 650px;
    padding: 36px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: 0 24px 80px #00000040;
}
.brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 30px;
}
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 650;
    letter-spacing: 1.6px;
}
.brand-icon {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    background: #203b35;
    color: var(--accent);
    border: 1px solid #34554b;
    border-radius: 10px;
    font-size: 24px;
    line-height: 1;
    font-weight: 400;
}
.language-pair {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .5px;
}
.language-pair span { color: var(--muted); }
.language-pair strong { color: var(--accent); font-weight: 600; }
h1 {
    margin: 0 0 10px;
    font-size: clamp(27px, 5vw, 36px);
    line-height: 1.2;
    letter-spacing: -1.1px;
    font-weight: 650;
}
.subtitle {
    margin: 0 0 30px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.65;
}
.search-label {
    display: block;
    margin-bottom: 10px;
    color: #c8d3da;
    font-size: 13px;
    font-weight: 600;
}
.search-box { position: relative; }
.search-icon {
    position: absolute;
    top: 50%;
    left: 17px;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: var(--muted);
    pointer-events: none;
}
input {
    width: 100%;
    padding: 17px 52px 17px 48px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: #0e151b;
    border-radius: 12px;
    border: 1px solid #3a4954;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
}
input::placeholder { color: #8c9da9; }
input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px #86e1c014;
}
#clearBtn {
    position: absolute;
    right: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 8px;
    background: transparent;
    font-size: 15px;
    cursor: pointer;
    color: var(--muted);
}
#clearBtn:hover { color: var(--text); background: #26343e; }
#clearBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search-hint {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
}
.suggestions {
    margin-top: 10px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px #00000020;
}
.suggestions:empty { display: none; }
.suggestion-item {
    padding: 14px 17px;
    background: #1b2730;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    transition: background .15s;
}
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover { background: #28433e; color: #b5f5de; }
.result-section { margin-top: 28px; }
.result-label {
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.6px;
    font-weight: 650;
}
.result {
    min-height: 126px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 26px 22px;
    border: 1px solid #365148;
    border-radius: 14px;
    background: #192b27;
    color: #b5f5de;
    font-size: 23px;
    font-weight: 500;
    line-height: 1.55;
    text-align: center;
    overflow-wrap: anywhere;
    cursor: pointer;
    transition: border-color .18s, background .18s;
}
.result:not(:empty):hover { background: #203830; border-color: var(--accent); }
.result:empty {
    background: #11191f;
    border: 1px dashed #34424c;
    cursor: default;
}
.result:empty::before {
    content: "Tutaj pojawi się tłumaczenie";
    color: #92a3af;
    font-size: 14px;
    font-weight: 400;
}
.footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 23px;
    padding-top: 21px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    text-align: center;
}
.footer svg { flex: 0 0 17px; color: var(--accent); }
@media (max-width: 520px) {
    body { padding: 24px 14px; }
    .container { padding: 25px 20px; border-radius: 19px; }
    .brand-row { margin-bottom: 27px; gap: 8px; }
    .brand { font-size: 10px; letter-spacing: 1px; gap: 8px; }
    .language-pair { gap: 8px; padding: 7px 9px; }
    .subtitle { font-size: 14px; margin-bottom: 25px; }
    input { font-size: 16px; padding-left: 43px; }
    .search-icon { left: 14px; }
    .result { font-size: 21px; min-height: 120px; }
}
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
}
</style>
</head>

<body>

<div class="container">
    <div class="brand-row">
        <div class="brand"><span class="brand-icon" aria-hidden="true">+</span> SŁOWNIK</div>
        <div class="language-pair" aria-label="Z polskiego na niemiecki">PL <span aria-hidden="true">→</span> <strong>DE</strong></div>
    </div>

    <label class="search-label" for="searchInput">Co chcesz przetłumaczyć?</label>
    <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input type="text" id="searchInput"
        placeholder="Wpisz słowo lub zdanie..."
        oninput="showSuggestions()"
        onkeydown="handleEnter(event)">
        <button id="clearBtn" onclick="clearSearch()" aria-label="Wyczyść wyszukiwanie" title="Wyczyść wyszukiwanie">✖</button>
    </div>
    <p class="search-hint">Wybierz podpowiedź lub wpisz pełne hasło i naciśnij Enter.</p>

    <div id="suggestions" class="suggestions"></div>
    <div class="result-section">
        <p class="result-label">TŁUMACZENIE · DE</p>
        <div id="result" class="result" aria-live="polite"></div>
    </div>

</div>
<script>

const dictionary = {
    // ===== UBRANIA (KLEIDUNG) =====
    "czapka": "die Mütze",
    "czerwona czapka": "eine rote Mütze",
    "kurtka": "die Jacke",
    "zielona kurtka": "eine grüne Jacke",
    "rękawiczki": "die Handschuhe",
    "kolorowe rękawiczki": "bunte Handschuhe",
    "spodnie": "die Hose",
    "jasne spodnie": "eine helle Hose",
    "pulower": "der Pullover",
    "żółty pulower": "ein gelber Pullover",
    "buty": "die Schuhe",
    "eleganckie buty": "elegante Schuhe",
    "t-shirt": "das T-Shirt",
    "niebieski t-shirt": "ein blaues T-Shirt",
    "płaszcz": "der Mantel",
    "elegancki płaszcz": "ein schicker Mantel",
    "szalik": "der Schal",
    "czerwony szalik": "ein roter Schal",
    "jeansy": "die Jeans",
    "niebieskie jeansy": "eine blaue Jeans",
    "koszula": "das Hemd",
    "koszula w kratę": "ein kariertes Hemd",
    "spódnica": "der Rock",
    "krótka spódnica": "ein kurzer Rock",
    "sukienka": "das Kleid",
    "żółta sukienka": "ein gelbes Kleid",
    "bluza": "das Sweatshirt",
    "niebieska bluza": "ein blaues Sweatshirt",
    "bluzka": "die Bluse",
    "elegancka bluzka": "eine elegante Bluse",

    // ===== PORY ROKU =====
    "wiosna": "der Frühling",
    "lato": "der Sommer",
    "jesień": "der Herbst",
    "zima": "der Winter",

    // ===== ZWROTY SKLEPOWE / ZAKUPY =====
    "ile to kosztuje": "Wie viel kostet das?",
    "co mogę dla ciebie zrobić?": "Was kann ich für dich tun?",
    "czy mogę to przymierzyć?": "Kann ich das anprobieren?",
    "gdzie jest przymierzalnia?": "Wo ist die Umkleidekabine?",
    "jaki to jest rozmiar?": "Welche Größe ist das?",
    "czy mają to państwo w rozmiarze m?": "Haben Sie das in Größe M?",
    "czy mają to państwo również w innym kolorze?": "Haben Sie das auch in einer anderen Farbe?",
    "to jest za duże / za małe": "Das ist zu groß / zu klein.",
    "to jest za duże": "Das ist zu groß.",
    "to jest za małe": "Das ist zu klein.",
    "to na mnie dobrze leży / pasuje mi": "Das passt mir gut.",
    "pasuje mi": "Das passt mir gut.",
    "wezmę to": "Ich nehme das.",
    "tylko się rozglądam, dziękuję!": "Ich schaue mich nur um, danke!",
    "tylko się rozglądam": "Ich schaue mich nur um.",
    "czy mogę państwu / panu / pani pomóc?": "Kann ich Ihnen helfen?",
    "czy mogę panu pomóc?": "Kann ich Ihnen helfen?",
    "czy mogę pani pomóc?": "Kann ich Ihnen helfen?",
    "co mogę dla państwa / pana / pani zrobić?": "Was kann ich für Sie tun?",
    "co mogę dla pana zrobić?": "Was kann ich für Sie tun?",
    "co mogę dla pani zrobić?": "Was kann ich für Sie tun?",
    "co mogę dla ciebie zrobić? (mniej formalnie)": "Was kann ich für dich tun?",
    "jakiego rozmiaru pan/pani szuka?": "Welche Größe suchen Sie?",
    "jaki masz rozmiar? (mniej formalnie)": "Welche Größe hast du?",
    "jaki masz rozmiar": "Welche Größe hast du?",
    "jak to leży / jaki to ma krojenie?": "Wie fällt das aus?",
    "przymierzalnia jest tam po drugiej stronie": "Die Umkleidekabine ist dort drüben.",
    "gdzie jest kasa?": "Wo ist die Kasse?",
    "czy mogę zapłacić kartą?": "Kann ich mit Karte bezahlen?",
    "chcę zapłacić gotówką": "Ich möchte bar bezahlen.",
    "czy mogę prosić o paragon?": "Kann ich den Kassenbon haben?"
};

// Normalizacja tekstu (uwzględniająca polskie litery)
function normalizeText(text) {
    return text
    .toLowerCase()
    .replace(/ł/g, "l")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function showSuggestions() {
    const input = normalizeText(document.getElementById("searchInput").value);
    const suggestionsDiv = document.getElementById("suggestions");
    suggestionsDiv.innerHTML = "";

    if(input.length === 0) return;

    const matches = Object.keys(dictionary).filter(word => 
        normalizeText(word).includes(input)
    );

    matches.forEach(word => {
        const div = document.createElement("div");
        div.textContent = word;
        div.classList.add("suggestion-item");
        div.onclick = function() {
            selectWord(word);
        };
        suggestionsDiv.appendChild(div);
    });
}

function selectWord(word) {
    document.getElementById("searchInput").value = word;
    document.getElementById("suggestions").innerHTML = "";
    showResult(word);
    speak(dictionary[word]);
}

function showResult(word) {
    const resultDiv = document.getElementById("result");
    resultDiv.textContent = dictionary[word];
    resultDiv.onclick = function() {
        speak(dictionary[word]);
    };
}

function handleEnter(event) {
    if(event.key === "Enter") {
        const input = normalizeText(document.getElementById("searchInput").value);
        const match = Object.keys(dictionary).find(key => 
            normalizeText(key) === input
        );
        if(match) {
            selectWord(match);
        }
    }
}

function speak(text) {
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "de-DE";
    speech.rate = 0.9;
    speech.pitch = 1;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}

function clearSearch() {
    document.getElementById("searchInput").value = "";
    document.getElementById("suggestions").innerHTML = "";
    document.getElementById("result").textContent = "";
    window.speechSynthesis.cancel();
}

</script>
</body>
</html>
