<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Słownik Ubrania i Zakupy PL → DE</title>

<style>
:root {
    color-scheme: dark;
    --page: #0c1116;
    --panel: #141c23;
    --line: #2b3842;
    --text: #edf3f6;
    --muted: #a0afb9;
    --accent: #86e1c0;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 76px 24px 40px;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at 50% 0%, #1b3034 0%, transparent 55%), var(--page);
    display: flex;
    align-items: flex-start;
    justify-content: center;
}
.container {
    width: 100%;
    max-width: 680px;
    padding: 36px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: 0 24px 80px #00000040;
}
.brand-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 30px;
}
.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 650;
    letter-spacing: 1.6px;
}
.brand-icon {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    background: #203b35;
    color: var(--accent);
    border: 1px solid #34554b;
    border-radius: 10px;
    font-size: 24px;
    line-height: 1;
    font-weight: 400;
}
.language-pair {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .5px;
}
.language-pair span { color: var(--muted); }
.language-pair strong { color: var(--accent); font-weight: 600; }
.search-label {
    display: block;
    margin-bottom: 10px;
    color: #c8d3da;
    font-size: 13px;
    font-weight: 600;
}
.search-box { position: relative; }
.search-icon {
    position: absolute;
    top: 50%;
    left: 17px;
    transform: translateY(-50%);
    width: 20px;
    height: 20px;
    color: var(--muted);
    pointer-events: none;
}
input[type="text"] {
    width: 100%;
    padding: 17px 52px 17px 48px;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: #0e151b;
    border-radius: 12px;
    border: 1px solid #3a4954;
    outline: none;
    transition: border-color .18s, box-shadow .18s;
}
input[type="text"]::placeholder { color: #8c9da9; }
input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px #86e1c014;
}
#clearBtn {
    position: absolute;
    right: 9px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 8px;
    background: transparent;
    font-size: 15px;
    cursor: pointer;
    color: var(--muted);
}
#clearBtn:hover { color: var(--text); background: #26343e; }
.search-hint {
    margin: 10px 0 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
}
.suggestions {
    margin-top: 10px;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 24px #00000020;
}
.suggestions:empty { display: none; }
.suggestion-item {
    padding: 14px 17px;
    background: #1b2730;
    cursor: pointer;
    border-bottom: 1px solid var(--line);
    font-size: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    transition: background .15s;
}
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover { background: #28433e; color: #b5f5de; }

.settings-section {
    margin-top: 22px;
    padding: 16px;
    background: #0e151b;
    border: 1px solid #283640;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.setting-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.settings-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #c8d3da;
    font-weight: 600;
}
.speed-value {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
}
.speed-slider {
    width: 100%;
    height: 6px;
    background: #1e2a33;
    border-radius: 3px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
}
.speed-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #0e151b;
    box-shadow: 0 0 6px rgba(134, 225, 192, 0.4);
    transition: transform 0.1s;
}
.speed-slider::-webkit-slider-thumb:hover {
    transform: scale(1.15);
}
.voice-select {
    width: 100%;
    padding: 10px 14px;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: #141c23;
    border: 1px solid #3a4954;
    border-radius: 8px;
    outline: none;
    cursor: pointer;
    transition: border-color .18s;
}
.voice-select:focus {
    border-color: var(--accent);
}

.result-section { margin-top: 24px; }
.result-label {
    margin: 0 0 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.6px;
    font-weight: 650;
}
.result {
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    border: 1px solid #365148;
    border-radius: 14px;
    background: #192b27;
    color: #b5f5de;
    font-size: 22px;
    font-weight: 500;
    line-height: 1.55;
    text-align: center;
    overflow-wrap: anywhere;
    cursor: pointer;
    transition: border-color .18s, background .18s;
}
.result:not(:empty):hover { background: #203830; border-color: var(--accent); }
.result:empty {
    background: #11191f;
    border: 1px dashed #34424c;
    cursor: default;
}
.result:empty::before {
    content: "Tutaj pojawi się tłumaczenie";
    color: #92a3af;
    font-size: 14px;
    font-weight: 400;
}

/* Sekcja opisu obrazka w pojedynczych zdaniach po niemiecku */
.image-story-section {
    margin-top: 28px;
    padding: 20px;
    background: #0e151b;
    border: 1px solid #283640;
    border-radius: 16px;
}
.image-story-title {
    margin: 0 0 14px;
    font-size: 14px;
    font-weight: 650;
    color: var(--accent);
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.story-layout {
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.story-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.sentence-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
}
.chip {
    padding: 8px 12px;
    background: #141c23;
    border: 1px solid #2b3842;
    border-radius: 8px;
    font-size: 12.5px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    width: 100%;
}
.chip:hover {
    background: #203830;
    border-color: var(--accent);
    color: #b5f5de;
}
.chip-pl {
    display: block;
    font-size: 11px;
    color: var(--muted);
}
.chip-de {
    display: block;
    font-weight: 600;
    color: var(--accent);
}

@media (max-width: 520px) {
    body { padding: 24px 14px; }
    .container { padding: 25px 20px; border-radius: 19px; }
    .brand-row { margin-bottom: 27px; gap: 8px; }
    .brand { font-size: 10px; letter-spacing: 1px; gap: 8px; }
    .language-pair { gap: 8px; padding: 7px 9px; }
    input[type="text"] { font-size: 16px; padding-left: 43px; }
    .search-icon { left: 14px; }
    .result { font-size: 20px; min-height: 110px; }
}
</style>
</head>

<body>

<div class="container">
    <div class="brand-row">
        <div class="brand"><span class="brand-icon" aria-hidden="true">+</span> SŁOWNIK</div>
        <div class="language-pair" aria-label="Z polskiego na niemiecki">PL <span aria-hidden="true">→</span> <strong>DE</strong></div>
    </div>

    <label class="search-label" for="searchInput">Co chcesz przetłumaczyć?</label>
    <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
        <input type="text" id="searchInput"
        placeholder="Wpisz słowo lub zdanie..."
        oninput="showSuggestions()"
        onkeydown="handleEnter(event)">
        <button id="clearBtn" onclick="clearSearch()" aria-label="Wyczyść wyszukiwanie" title="Wyczyść wyszukiwanie">✖</button>
    </div>
    <p class="search-hint">Wybierz podpowiedź lub wpisz pełne hasło i naciśnij Enter.</p>

    <div id="suggestions" class="suggestions"></div>

    <div class="settings-section">
        <div class="setting-group">
            <div class="settings-header">
                <label for="speedRange">Prędkość mowy (de):</label>
                <span id="speedValue" class="speed-value">0.7x</span>
            </div>
            <!-- Domyślna prędkość ustawiona na 0.7 -->
            <input type="range" id="speedRange" class="speed-slider" min="0.5" max="2.0" step="0.1" value="0.7" oninput="updateSpeedValue(this.value)">
        </div>
        <div class="setting-group">
            <label class="settings-header" for="voiceSelect">Głos lektora:</label>
            <select id="voiceSelect" class="voice-select"></select>
        </div>
    </div>

    <div class="result-section">
        <p class="result-label">TŁUMACZENIE · DE</p>
        <div id="result" class="result" aria-live="polite"></div>
    </div>

    <!-- DOLNA SEKCJA: NOWY OPIS OBRAZKA -->
    <div class="image-story-section">
        <h3 class="image-story-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            Opis obrazka (Zakupy w sklepie)
        </h3>
        <div class="story-layout">
            <div class="story-content">
                <div class="sentence-chips">
                    <button class="chip" onclick="playSentence('Auf dem Bild sieht man eine junge Frau in einem Bekleidungsgeschäft.')">
                        <span class="chip-pl">Na zdjęciu widać młodą kobietę w sklepie odzieżowym.</span>
                        <span class="chip-de">Auf dem Bild sieht man eine junge Frau in einem Bekleidungsgeschäft.</span>
                    </button>
                    <button class="chip" onclick="playSentence('Sie hat lange, dunkle Haare und lächelt freundlich.')">
                        <span class="chip-pl">Kobieta ma długie, ciemne włosy i przyjaźnie się uśmiecha.</span>
                        <span class="chip-de">Sie hat lange, dunkle Haare und lächelt freundlich.</span>
                    </button>
                    <button class="chip" onclick="playSentence('Sie trägt ein blaues Oberteil.')">
                        <span class="chip-pl">Ma na sobie niebieską bluzkę.</span>
                        <span class="chip-de">Sie trägt ein blaues Oberteil.</span>
                    </button>
                    <button class="chip" onclick="playSentence('In der Hand hält sie einen Stapel Kleidung.')">
                        <span class="chip-pl">W ręku trzyma stos ubrań.</span>
                        <span class="chip-de">In der Hand hält sie einen Stapel Kleidung.</span>
                    </button>
                    <button class="chip" onclick="playSentence('Außerdem trägt sie eine Einkaufstasche.')">
                        <span class="chip-pl">Trzyma również torbę na zakupy.</span>
                        <span class="chip-de">Außerdem trägt sie eine Einkaufstasche.</span>
                    </button>
                    <button class="chip" onclick="playSentence('Im Hintergrund stehen Kleiderständer mit vielen Klamotten.')">
                        <span class="chip-pl">W tle znajdują się wieszaki z wieloma ubraniami.</span>
                        <span class="chip-de">Im Hintergrund stehen Kleiderständer mit vielen Klamotten.</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
const dictionary = {
    // ===== UBRANIA (KLEIDUNG) =====
    "czapka": "die Mütze",
    "czerwona czapka": "eine rote Mütze",
    "kurtka": "die Jacke",
    "zielona kurtka": "eine grüne Jacke",
    "rękawiczki": "die Handschuhe",
    "kolorowe rękawiczki": "bunte Handschuhe",
    "spodnie": "die Hose",
    "jasne spodnie": "eine helle Hose",
    "pulower": "der Pullover",
    "żółty pulower": "ein gelber Pullover",
    "buty": "die Schuhe",
    "eleganckie buty": "elegante Schuhe",
    "t-shirt": "das T-Shirt",
    "niebieski t-shirt": "ein blaues T-Shirt",
    "płaszcz": "der Mantel",
    "elegancki płaszcz": "ein schicker Mantel",
    "szalik": "der Schal",
    "czerwony szalik": "ein roter Schal",
    "jeansy": "die Jeans",
    "niebieskie jeansy": "eine blaue Jeans",
    "koszula": "das Hemd",
    "koszula w kratę": "ein kariertes Hemd",
    "spódnica": "der Rock",
    "krótka spódnica": "ein kurzer Rock",
    "sukienka": "das Kleid",
    "żółta sukienka": "ein gelbes Kleid",
    "bluza": "das Sweatshirt",
    "niebieska bluza": "ein blaues Sweatshirt",
    "bluzka": "die Bluse",
    "elegancka bluzka": "eine elegante Bluse",

    // ===== PORY ROKU =====
    "wiosna": "der Frühling",
    "lato": "der Sommer",
    "jesień": "der Herbst",
    "zima": "der Winter",

    // ===== ZWROTY SKLEPOWE / ZAKUPY I OPIS OBRAZKA =====
    "ile to kosztuje": "Wie viel kostet das?",
    "co mogę dla ciebie zrobić?": "Was kann ich für dich tun?",
    "czy mogę to przymierzyć?": "Kann ich das anprobieren?",
    "gdzie jest przymierzalnia?": "Wo ist die Umkleidekabine?",
    "jaki to jest rozmiar?": "Welche Größe ist das?",
    "czy mają to państwo w rozmiarze m?": "Haben Sie das in Größe M?",
    "czy mają to państwo również w innym kolorze?": "Haben Sie das auch in einer anderen Farbe?",
    "to jest za duże / za małe": "Das ist zu groß / zu klein.",
    "to jest za duże": "Das ist zu groß.",
    "to jest za małe": "Das ist zu klein.",
    "to na mnie dobrze leży / pasuje mi": "Das passt mir gut.",
    "pasuje mi": "Das passt mir gut.",
    "wezmę to": "Ich nehme das.",
    "tylko się rozglądam, dziękuję!": "Ich schaue mich nur um, danke!",
    "tylko się rozglądam": "Ich schaue mich nur um.",
    "czy mogę państwu / panu / pani pomóc?": "Kann ich Ihnen helfen?",
    "czy mogę panu pomóc?": "Kann ich Ihnen helfen?",
    "czy mogę pani pomóc?": "Kann ich Ihnen helfen?",
    "co mogę dla państwa / pana / pani zrobić?": "Was kann ich für Sie tun?",
    "co mogę dla pana zrobić?": "Was kann ich für Sie tun?",
    "co mogę dla pani zrobić?": "Was kann ich für Sie tun?",
    "jakiego rozmiaru pan/pani szuka?": "Welche Größe suchen Sie?",
    "jaki masz rozmiar?": "Welche Größe hast du?",
    "jaki kolor pani chce?": "Welche Farbe möchten Sie?",
    
    // Słówka z nowego opisu obrazka dodane do słownika:
    "na zdjęciu widać młodą kobietę w sklepie odzieżowym": "Auf dem Bild sieht man eine junge Frau in einem Bekleidungsgeschäft.",
    "kobieta ma długie, ciemne włosy i przyjaźnie się uśmiecha": "Sie hat lange, dunkle Haare und lächelt freundlich.",
    "ma na sobie niebieską bluzkę": "Sie trägt ein blaues Oberteil.",
    "w ręku trzyma stos ubrań": "In der Hand hält sie einen Stapel Kleidung.",
    "trzyma również torbę na zakupy": "Außerdem trägt sie eine Einkaufstasche.",
    "w tle znajdują się wieszaki z wieloma ubraniami": "Im Hintergrund stehen Kleiderständer mit vielen Klamotten."
};

let voices = [];

function populateVoiceList() {
    if (typeof speechSynthesis === 'undefined') return;
    voices = speechSynthesis.getVoices().filter(voice => voice.lang.startsWith('de') || voice.lang.startsWith('de-'));
    if (voices.length === 0) {
        voices = speechSynthesis.getVoices();
    }
    
    const voiceSelect = document.getElementById('voiceSelect');
    voiceSelect.innerHTML = '';

    if (voices.length === 0) {
        const option = document.createElement('option');
        option.textContent = 'Brak głosów w przeglądarce';
        voiceSelect.appendChild(option);
        return;
    }

    voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
    });
}

if (typeof speechSynthesis !== 'undefined') {
    populateVoiceList();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoiceList;
    }
}

// Normalizacja tekstu (uwzględniająca polskie litery)
function normalizeText(text) {
    return text
    .toLowerCase()
    .replace(/ł/g, "l")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "");
}

function showSuggestions() {
    const input = normalizeText(document.getElementById("searchInput").value);
    const suggestionsDiv = document.getElementById("suggestions");
    suggestionsDiv.innerHTML = "";

    if(input.length === 0) return;

    const matches = Object.keys(dictionary).filter(word => 
        normalizeText(word).includes(input)
    );

    matches.forEach(word => {
        const div = document.createElement("div");
        div.textContent = word;
        div.classList.add("suggestion-item");
        div.onclick = function() {
            selectWord(word);
        };
        suggestionsDiv.appendChild(div);
    });
}

function selectWord(word) {
    document.getElementById("searchInput").value = word;
    document.getElementById("suggestions").innerHTML = "";
    showResult(word);
    speak(dictionary[word]);
}

function showResult(word) {
    const resultDiv = document.getElementById("result");
    resultDiv.textContent = dictionary[word];
    resultDiv.onclick = function() {
        speak(dictionary[word]);
    };
}

function handleEnter(event) {
    if(event.key === "Enter") {
        const input = normalizeText(document.getElementById("searchInput").value);
        const match = Object.keys(dictionary).find(key => 
            normalizeText(key) === input
        );
        if(match) {
            selectWord(match);
        }
    }
}

function updateSpeedValue(val) {
    document.getElementById("speedValue").textContent = parseFloat(val).toFixed(1) + "x";
}

function speak(text) {
    if (typeof speechSynthesis === 'undefined') return;
    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "de-DE";
    
    const speedRange = document.getElementById("speedRange");
    speech.rate = speedRange ? parseFloat(speedRange.value) : 0.7;
    speech.pitch = 1;

    const voiceSelect = document.getElementById("voiceSelect");
    if (voiceSelect && voices.length > 0 && voiceSelect.value !== "") {
        const selectedVoice = voices[parseInt(voiceSelect.value)];
        if (selectedVoice) {
            speech.voice = selectedVoice;
        }
    }

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}

function playSentence(germanSentence) {
    const resultDiv = document.getElementById("result");
    resultDiv.textContent = germanSentence;
    speak(germanSentence);
}

function clearSearch() {
    document.getElementById("searchInput").value = "";
    document.getElementById("suggestions").innerHTML = "";
    document.getElementById("result").textContent = "";
    if (typeof speechSynthesis !== 'undefined') {
        window.speechSynthesis.cancel();
    }
}
</script>
</body>
</html>
